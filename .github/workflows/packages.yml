name: Build downloads
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/test_web.cjs
      - run: node tests/test_aircraft_catalog.cjs
      - name: Install Linux native window prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1 xvfb xauth dbus-x11
          /usr/bin/python3 -m venv --system-site-packages "$RUNNER_TEMP/mdz-gtk"
          "$RUNNER_TEMP/mdz-gtk/bin/python" -m pip install -r desktop-requirements.txt
      - name: Verify native Linux app window and shutdown
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: dbus-run-session -- xvfb-run -a "$RUNNER_TEMP/mdz-gtk/bin/python" tests/smoke_linux_window.py
      - run: python scripts/package_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-portable
          path: dist/*
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: npm install --prefix "$env:RUNNER_TEMP/mdz-browser" --no-audit --no-fund playwright-core@1.56.1
      - run: python -m pip install pyinstaller==6.16.0 -r desktop-requirements.txt
      - name: Build self-contained native Windows executable
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --collect-all webview --collect-all pythonnet --collect-all clr_loader --name MDZ-SkyScan --add-data "web;web" desktop.py
          New-Item -ItemType Directory -Path dist/MDZ-SkyScan | Out-Null
          Copy-Item dist/MDZ-SkyScan.exe dist/MDZ-SkyScan/MDZ-SkyScan.exe
          Copy-Item dist/MDZ-SkyScan.exe dist/MDZ-SkyScan-windows.exe
      - name: Include verified WebView2 installer and ensure native runtime
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') {
            throw 'The WebView2 installer did not pass Microsoft Authenticode verification'
          }
          function Get-WebView2Version {
            $keys = @(
              'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
              'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
              'HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
            )
            foreach ($key in $keys) {
              $runtimeVersion = (Get-ItemProperty $key -Name pv -ErrorAction SilentlyContinue).pv
              if ($runtimeVersion -and $runtimeVersion -ne '0.0.0.0') { return $runtimeVersion }
            }
            return $null
          }
          if (-not (Get-WebView2Version)) {
            $setup = Start-Process $installer -ArgumentList '/silent', '/install' -Wait -PassThru
            if ($setup.ExitCode -ne 0) { throw "WebView2 runtime setup exited with $($setup.ExitCode)" }
          }
          if (-not (Get-WebView2Version)) { throw 'WebView2 Runtime is not installed' }
          Copy-Item $installer dist/MDZ-SkyScan/
      - name: Reproduce blocked old DLL and verify downloaded native app
        shell: pwsh
        run: ./tests/smoke_windows.ps1
      - shell: pwsh
        run: |
          Copy-Item README.md dist/MDZ-SkyScan/
          Compress-Archive -Path dist/MDZ-SkyScan -DestinationPath dist/MDZ-SkyScan-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/MDZ-SkyScan-windows.zip
            dist/MDZ-SkyScan-windows.exe
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use the runner's installed Android SDK
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Restore optional release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mdz-release.jks"
          fi
      - name: Build signed APK
        env:
          MDZ_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MDZ_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          MDZ_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -f "$RUNNER_TEMP/mdz-release.jks" ]; then
            export MDZ_ANDROID_KEYSTORE="$RUNNER_TEMP/mdz-release.jks"
          fi
          python scripts/build_android.py
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and smoke-test APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: python scripts/smoke_android.py
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/MDZ-SkyScan-android.apk
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [portable, windows, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true
      - name: Publish downloads and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd downloads
          sha256sum *.zip *.tar.gz *.apk *.exe > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes ./*
