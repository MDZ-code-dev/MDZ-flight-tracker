name: Build downloads
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/test_web.cjs
      - run: python scripts/package_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-portable
          path: dist/*
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller==6.16.0
      - run: python -m PyInstaller --noconfirm --clean --onedir --name MDZ-SkyScan --add-data "web;web" desktop.py
      - shell: pwsh
        run: |
          $env:MDZ_TRACKER_PORT = '18765'
          $env:MDZ_TRACKER_CONFIG = "$env:RUNNER_TEMP\mdz-config.json"
          $process = Start-Process dist/MDZ-SkyScan/MDZ-SkyScan.exe -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              try {
                $health = Invoke-RestMethod http://127.0.0.1:18765/health
                if ($health.ok) { $ready = $true; break }
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ready) { throw 'Packaged Windows server did not become healthy' }
            $page = Invoke-WebRequest http://127.0.0.1:18765/
            if (-not $page.Content.Contains('MDZ SKYSCAN')) { throw 'Missing bundled web assets' }
            $planes = Invoke-RestMethod http://127.0.0.1:18765/api/planes
            if (-not $planes.needs_location) { throw 'Unexpected initial aircraft response' }
          } finally {
            Stop-Process -Id $process.Id -ErrorAction SilentlyContinue
          }
          Copy-Item README.md dist/MDZ-SkyScan/
          Compress-Archive -Path dist/MDZ-SkyScan -DestinationPath dist/MDZ-SkyScan-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/MDZ-SkyScan-windows.zip
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use the runner's installed Android SDK
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Restore optional release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mdz-release.jks"
          fi
      - name: Build signed APK
        env:
          MDZ_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MDZ_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          MDZ_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -f "$RUNNER_TEMP/mdz-release.jks" ]; then
            export MDZ_ANDROID_KEYSTORE="$RUNNER_TEMP/mdz-release.jks"
          fi
          python scripts/build_android.py
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and smoke-test APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: python scripts/smoke_android.py
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/MDZ-SkyScan-android.apk
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [portable, windows, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true
      - name: Publish downloads and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd downloads
          sha256sum *.zip *.tar.gz *.apk > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes ./*
